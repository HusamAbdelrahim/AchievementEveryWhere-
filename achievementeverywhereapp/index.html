<!DOCTYPE html>
<html>
<head>
  <meta charset = "utf-8">
  <link rel = "stylesheet" href = "mystyleinteraction.css">
</head>
<body>


<header class = "topbar">
  <img src = "ach_icon.png" alt = "" class = "logo">
<nav class =  "nav">
    <button class = "nav-item">Achievements Category</button>
    <button class = "nav-item">Tracking</button>
    <button class = "nav-item">Completed</button>
  </nav>
</header>

<div class="group">
  <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
    <g>
      <path
        d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"
      ></path>
    </g>
  </svg>

  <input
    id="query"
    class="input"
    type="search"
    placeholder="Search..."
    name="searchbar"
  />
</div>


<main class="content" id="categories">

  <div class="card" data-category="reading">
    <img src="book.png" alt="Reading books">
    <div class="card-body">
      <h4>Reading Books</h4>
      
    </div>
  </div>

  <div class="card" data-category="running">
    <img src="running.png" alt="Running">
    <div class="card-body">
      <h4>Running</h4>
    </div>
  </div>

  <div class="card" data-category="lifting">
    <img src="dumbells.png" alt="Lifting weights">
    <div class="card-body">
      <h4>Lifting Weights</h4>
    </div>
  </div>

</main>

<main class="content" id="detail" style="display: none">
  <button id="back">← Back</button>
  <h2 id="detail-title"></h2>
  <div id = "achievement-list"></div>
</main>

  <script src = 'renderer.js' ></script>

</body>
</html>
